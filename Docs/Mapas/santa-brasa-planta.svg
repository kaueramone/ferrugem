<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc">
<title id="title">Santa Brasa — estudo territorial de Ferrugem</title>
<desc id="desc">Mapa esquemático original de terreno de oito por oito quilômetros. Cidade central com um quilômetro de diâmetro, três acampamentos equidistantes a três quilômetros do centro, estradas curvas, floresta e relevo ilustrativos.</desc>
<defs>
 <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#c5bea8" stroke-width="1"/></pattern>
 <pattern id="forest" width="23" height="25" patternUnits="userSpaceOnUse"><path d="M11 4L4 18H18Z" fill="#798067" opacity=".45"/></pattern>
 <pattern id="hill" width="39" height="30" patternUnits="userSpaceOnUse"><path d="M2 24L18 6L34 24M13 12L18 15L23 12" fill="none" stroke="#8e8774" stroke-width="1.3"/></pattern>
 <style>text{font-family:Arial,sans-serif;fill:#31382f}.small{font-size:13px}.label{font-size:16px;font-weight:bold}.note{font-size:14px}.halo{paint-order:stroke;stroke:#eee9d9;stroke-width:5px;stroke-linejoin:round}.distance{stroke:#9c633f;stroke-width:1.8;stroke-dasharray:7 7;fill:none}.road{stroke:#5a5a50;stroke-width:6;fill:none;stroke-linecap:round}.dirt{stroke:#a98b61;stroke-width:4;stroke-dasharray:10 5;fill:none;stroke-linecap:round}.camp{fill:#806343;stroke:#eee9d9;stroke-width:3}</style>
