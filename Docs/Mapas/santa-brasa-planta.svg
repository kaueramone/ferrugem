<text x="70" y="1094" class="note">Acampamentos civis remendados: barracas, sucata e estruturas leves; sem fortalezas militares.</text>
<text x="70" y="1120" class="note">Arte vetorial original de planejamento produzida com participação de IA. Nenhuma imagem ou asset de terceiros incorporado.</text>
<text x="70" y="1146" class="small">Este documento não é um asset do jogo. Distâncias planas; terreno, relevo, circulação e balanceamento exigem protótipo jogável.</text>
